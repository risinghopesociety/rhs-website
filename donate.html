<script type="module">

  import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyArd3DU3G4thncYaGuKSEseusduNSMORzs",
    authDomain: "rising-hope-society-pk.firebaseapp.com",
    projectId: "rising-hope-society-pk",
    storageBucket: "rising-hope-society-pk.firebasestorage.app",
    messagingSenderId: "371234102504",
    appId: "1:371234102504:web:a8bf7d8cc51d1fd797fd5d"

  const app = initializeApp(FIREBASE_CONFIG);

<script>
  // ===== Language toggle (EN/UR) =====
  let isUrdu = false;
  window.toggleLang = function () {
    isUrdu = !isUrdu;
    const label  = document.getElementById("langLabel");
    const htmlEl = document.getElementById("htmlRoot");
    if (label) label.textContent = isUrdu ? "English" : "اردو";
    if (htmlEl) {
      htmlEl.setAttribute("lang", isUrdu ? "ur" : "en");
      if (isUrdu) htmlEl.setAttribute("dir", "rtl"); else htmlEl.removeAttribute("dir");
    }
    document.querySelectorAll("[data-ur]").forEach(el => {
      if (isUrdu) { el._origText = el.textContent; el.textContent = el.getAttribute("data-ur"); }
      else if (el._origText) { el.textContent = el._origText; }
    });
  };

  // ===== Copy bank field to clipboard =====
  window.copyBankField = function (btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      const icon = btn.querySelector("i");
      const prevClass = icon.className;
      icon.className = "fa-solid fa-check";
      btn.classList.add("copied");
      setTimeout(() => { icon.className = prevClass; btn.classList.remove("copied"); }, 1500);
    }).catch(() => {});
  };

  function escHtml(s) {
    const d = document.createElement("div");
    d.appendChild(document.createTextNode(s || ""));
    return d.innerHTML;
  }

  // ===== Load donate content + bank accounts from Firestore =====
  function waitForRHS() {
    return new Promise(resolve => {
      if (window.RHS) return resolve();
      const iv = setInterval(() => { if (window.RHS) { clearInterval(iv); resolve(); } }, 150);
    });
  }

  waitForRHS().then(async () => {
    try {
      const res = await RHS.getDonateContent();
      const hEl = document.getElementById("donateHeading");
      const sEl = document.getElementById("donateSubheading");
      const dEl = document.getElementById("donateDetail");
      if (hEl) hEl.textContent = res.heading || "Support Our Cause";
      if (sEl) sEl.textContent = res.subheading || "";
      if (dEl) dEl.textContent = res.detail || "";
    } catch (e) {
      const dEl = document.getElementById("donateDetail");
      if (dEl) dEl.textContent = "";
    }

    const grid = document.getElementById("bankGrid");
    try {
      const res = await RHS.getBankAccounts();
      if (!res.banks || !res.banks.length) {
        grid.innerHTML = `<div class="donate-empty"><i class="fa-solid fa-building-columns"></i>Bank details will be added here soon. Please contact us on WhatsApp to donate.</div>`;
        return;
      }
      grid.innerHTML = res.banks.map(b => `
        <div class="bank-card">
          <div class="bank-card-icon"><i class="fa-solid fa-building-columns"></i></div>
          <h3>${escHtml(b.bankName || "")}</h3>
          <div class="bank-card-row">
            <span class="label">Title of Account</span>
            <span class="value">${escHtml(b.accountTitle || "")}</span>
          </div>
          <div class="bank-card-row">
            <span class="label">Account No</span>
            <span class="value">
              <span>${escHtml(b.accountNo || "")}</span>
              <button class="bank-copy-btn" title="Copy" onclick="copyBankField(this,'${(b.accountNo || "").replace(/'/g, "\\'")}')"><i class="fa-solid fa-copy"></i></button>
            </span>
          </div>
        </div>
      `).join("");
    } catch (e) {
      grid.innerHTML = `<div class="donate-empty"><i class="fa-solid fa-triangle-exclamation"></i>Could not load bank details. Please try again later.</div>`;
    }
  });
</script>
